# Dummy values so @WebMvcTest can resolve application.yaml placeholders
# without a local .env, Postgres, or RabbitMQ. The web slice does not connect.
DB_PASSWORD=test
RABBITMQ_USERNAME=test
RABBITMQ_PASSWORD=test

# Local test issuer. Signatures use the classpath key, not a network JWKS.
FLOWFORGE_OIDC_ISSUER_URI=http://auth.test/realms/flowforge
FLOWFORGE_OIDC_AUDIENCE=flowforge-api
FLOWFORGE_OIDC_PUBLIC_KEY_LOCATION=classpath:security/test-jwt-public.pem
