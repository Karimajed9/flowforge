server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        # Spring Session writes this cookie. HttpOnly and SameSite=Lax.
        # Secure is not forced: it is set only when the request is HTTPS.
        name: SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: flowforge

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 1

        retry:
          enabled: true
          stateless: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

  session:
    timeout: 30m
    jdbc:
      # Flyway V14 creates SPRING_SESSION. Do not run a second initializer.
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowforge:
  outbox:
    poll-interval-ms: 2000

  consumer:
    enabled: true

  rabbitmq:
    management-url: ${FLOWFORGE_RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
    # rabbitmq-setup may apply flowforge-dlx after this process starts.
    policy-wait: 60s
    policy-interval: 2s

  recovery:
    enabled: ${FLOWFORGE_RECOVERY_ENABLED:false}
    token: ${FLOWFORGE_RECOVERY_TOKEN:}

  security:
    # Required. The process refuses to start when these are unset.
    # Production verifies signatures against the issuer JWKS.
    # That lookup runs on the first bearer token, so a down issuer does not
    # stop the process. Requests still require a valid JWT.
    issuer-uri: ${FLOWFORGE_OIDC_ISSUER_URI}
    audience: ${FLOWFORGE_OIDC_AUDIENCE}
    # Empty in production. Tests set a classpath public key so they do not
    # call an identity provider. Do not point this at a production key.
    public-key-location: ${FLOWFORGE_OIDC_PUBLIC_KEY_LOCATION:}
    # Confidential BFF client. The secret is empty unless the environment
    # sets it. Do not put a real secret in this file. Both modes are active:
    # Authorization: Bearer stays the stateless resource server the current
    # React app uses, and a browser without that header uses the OIDC session.
    client-id: ${FLOWFORGE_OIDC_CLIENT_ID:flowforge-bff}
    client-secret: ${FLOWFORGE_OIDC_CLIENT_SECRET:}

  http-get:
    connect-timeout: 2s
    request-timeout: 5s
    max-response-bytes: 65536
    # Default deny. A host is allowed only when named here exactly.
    # For a local test, set FLOWFORGE_HTTP_GET_ALLOWED_HOSTS in ../.env.
    # There is no allow-all value.
    allowed-hosts: []
