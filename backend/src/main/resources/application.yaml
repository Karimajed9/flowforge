server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: flowforge

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 1

        retry:
          enabled: true
          stateless: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowforge:
  outbox:
    poll-interval-ms: 2000

  consumer:
    enabled: true

  rabbitmq:
    management-url: ${FLOWFORGE_RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
    # rabbitmq-setup may apply flowforge-dlx after this process starts.
    policy-wait: 60s
    policy-interval: 2s

  recovery:
    enabled: ${FLOWFORGE_RECOVERY_ENABLED:false}
    token: ${FLOWFORGE_RECOVERY_TOKEN:}

  http-get:
    connect-timeout: 2s
    request-timeout: 5s
    max-response-bytes: 65536
    # Default deny. A host is allowed only when named here exactly.
    # For a local test, set FLOWFORGE_HTTP_GET_ALLOWED_HOSTS in ../.env.
    # There is no allow-all value.
    allowed-hosts: []