server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: flowforge

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowforge:
  outbox:
    poll-interval-ms: 2000